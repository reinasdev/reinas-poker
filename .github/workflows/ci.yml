name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://reinas_poker:reinas_poker@localhost:5432/reinas_poker

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reinas_poker
          POSTGRES_USER: reinas_poker
          POSTGRES_PASSWORD: reinas_poker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reinas_poker -d reinas_poker"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Migrations
        run: |
          npm run db:migrate
          npm run db:validate
          npm run db:generate
          git diff --exit-code -- drizzle

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env: { RUN_DB_TESTS: "1" }
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    # O login acontece no reinas-id, então o E2E sobe os dois serviços.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reinas_poker
          POSTGRES_USER: reinas_poker
          POSTGRES_PASSWORD: reinas_poker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reinas_poker -d reinas_poker"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres-id:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reinas_id
          POSTGRES_USER: reinas_id
          POSTGRES_PASSWORD: reinas_id
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U reinas_id -d reinas_id"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Baixa o reinas-id
        uses: actions/checkout@v4
        with:
          repository: reinasdev/reinas-id
          ref: main
          path: .reinas-id

      - name: Sobe o reinas-id
        working-directory: .reinas-id
        env:
          DATABASE_URL: postgresql://reinas_id:reinas_id@localhost:5433/reinas_id
          APP_URL: http://localhost:3001
          AUTH_HASH_SECRET: ci-secret-with-at-least-32-characters
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          # Todo o E2E sai de um IP só; o limite de produção barraria os testes.
          MAGIC_CODE_RATE_LIMIT: "500"
        run: |
          npm ci
          npm run db:migrate
          npm run build
          nohup npm start > "$RUNNER_TEMP/reinas-id.log" 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:3001/api/health

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e

      - if: failure()
        run: cat "$RUNNER_TEMP/reinas-id.log" || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 7
