services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planning_poker
      POSTGRES_USER: planning_poker
      POSTGRES_PASSWORD: planning_poker
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planning_poker -d planning_poker"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  app:
    build: { context: ., target: development }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://planning_poker:planning_poker@postgres:5432/planning_poker
      SMTP_HOST: mailpit
    ports: ["3000:3000"]
    volumes: [".:/app", "/app/node_modules", "/app/.next"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
volumes:
  postgres_data:
